{% extends 'base.html' %}
{% block title %}
  Criar conta · Aprenda+
{% endblock %}
{% block content %}
  <section class="card auth-card">
    <h1>
      Crie sua conta
    </h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}<button type="submit">Cadastrar</button>
    </form>
    <p>
      Já tem uma conta? <a href="{% url 'contas:login' %}">Entre aqui</a>
    </p>
  </section>
{% endblock %}
